[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/quote"
  to   = "/request-quote.html"
  status = 301

[[redirects]]
  from = "/capabilities"
  to   = "/capabilities.html"
  status = 301

[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 301

[[redirects]]
  from = "/contact"
  to   = "/contact.html"
  status = 301

[[redirects]]
  from = "/home"
  to   = "/index.html"
  status = 301
